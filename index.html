<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EBFA" />
    <title>Heloisa S. B. | Portfólio</title>
    <meta name="description" content="Portfólio de Heloisa S. B., designer e profissional de marketing: posts, desenhos, adesivos e banners." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, LinkedIn...).
         Troque os textos e a imagem public/og-image.jpg (1200 x 630) pelos definitivos.
         O endereço completo vem de VITE_SITE_URL, no arquivo .env. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Heloisa S. B." />
    <meta property="og:title" content="Heloisa S. B. | Designer e marketing" />
    <meta property="og:description" content="Posts, desenhos, adesivos e banners. Veja as coleções e peça um orçamento." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
