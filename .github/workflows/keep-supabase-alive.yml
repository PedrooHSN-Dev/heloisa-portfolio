# Faz uma leitura simples no Supabase a cada 2 dias para o plano gratuito não pausar o projeto
# por inatividade. Só funciona se o projeto estiver num repositório do GitHub.
# A chave abaixo é a "publishable" (pública); não coloque chaves secretas aqui.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 13 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler uma linha do banco
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_oNL70iNpqgNZaNiUItm-Sw_51u6kHtj" \
            "https://vbpnehixbphkfcvqqfzt.supabase.co/rest/v1/categories?select=id&limit=1"
